<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Processing Application</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="main-container">
        <div class="left-section">
            <h1>String Processing Application</h1>
            <p class="subtitle">Reverse a string and count words and vowels</p>
            
            <div class="input-wrapper">
                <label for="string-input">Enter String / Paragraph:</label>
                <textarea id="string-input" placeholder="String Processing Application which reverses a string and count words and vowels"></textarea>
            </div>
            
            <button id="process-btn">Process String</button>
        </div>
        
        <div class="separator"></div>
        
        <div class="right-section">
            <h2>Results</h2>
            
            <div class="output-box">
                <h4>1. Reversed String</h4>
                <div class="output-text" id="out-reversed"></div>
            </div>
            
            <div class="output-box">
                <h4>2. Number of Words</h4>
                <div class="output-text" id="out-words"></div>
            </div>
            
            <div class="output-box">
                <h4>3. Number of Vowels</h4>
                <div class="output-text" id="out-vowel-count"></div>
            </div>
            
            <div class="output-box">
                <h4>4. Vowels Found</h4>
                <div class="output-text" id="out-vowels-found"></div>
            </div>
        </div>
    </div>

    <script src="script2.js"></script>
</body>
</html>
