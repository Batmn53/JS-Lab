<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Processing using JavaScript</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>String Processing using JavaScript</h1>
            
            <div class="input-group">
                <label for="paragraph">Enter Paragraph:</label>
                <textarea id="paragraph" placeholder="String Processing using Javascript"></textarea>
            </div>
            
            <div class="input-group">
                <label for="email">Enter Email:</label>
                <input type="text" id="email" placeholder="abc@xyz.com">
            </div>
            
            <button id="processBtn">Process String</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="right-panel">
            <h2>Results</h2>
            
            <div class="result-card">
                <h3>1. Words:</h3>
                <p id="res-words"></p>
            </div>
            
            <div class="result-card">
                <h3>2. Vowels:</h3>
                <p id="res-vowels"></p>
            </div>
            
            <div class="result-card">
                <h3>3. Email Validation:</h3>
                <p id="res-email"></p>
            </div>
            
            <div class="result-card">
                <h3>4. Reversed Paragraph:</h3>
                <p id="res-reversed"></p>
            </div>
        </div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
