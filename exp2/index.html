<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Billing Calculator</title>
    <link rel="stylesheet" href="index.css">
    
    <!-- 1. Internal JavaScript -->
    <script>
        // This internal script runs when the body loads
        function initApp() {
            const dateStr = new Date().toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            document.getElementById('current-date').innerText = "Date: " + dateStr;
        }
    </script>
</head>
<body onload="initApp()">

    <div class="calculator-container">
        <h1>Cafe Billing Calculator</h1>
        <p id="current-date"></p>

        <div class="menu-items">
            <div class="item">
                <label>Coffee ($3.00)</label>
                <!-- Inline event listener calling external JS -->
                <input type="number" id="qty-coffee" min="0" value="0" onchange="calculateTotal()" onkeyup="calculateTotal()">
            </div>
            <div class="item">
                <label>Tea ($2.00)</label>
                <input type="number" id="qty-tea" min="0" value="0" onchange="calculateTotal()" onkeyup="calculateTotal()">
            </div>
            <div class="item">
                <label>Sandwich ($5.00)</label>
                <input type="number" id="qty-sandwich" min="0" value="0" onchange="calculateTotal()" onkeyup="calculateTotal()">
            </div>
            <div class="item">
                <label>Cake ($4.00)</label>
                <input type="number" id="qty-cake" min="0" value="0" onchange="calculateTotal()" onkeyup="calculateTotal()">
            </div>
        </div>

        <div class="actions">
            <!-- Inline event listener calling external JS function -->
            <button onclick="calculateTotal()">Calculate</button>
            <button class="secondary" onclick="resetForm()">Clear</button>
        </div>
        
        <!-- 2. Pure Inline JavaScript (No function definition, logic directly in attribute) -->
        <button class="print-btn" onclick="alert('Printing your bill... Thank you for visiting!')" style="width: 100%; margin-bottom: 1.5rem; background-color: #2b2d42;">Print Receipt</button>

        <div class="summary">
            <div class="summary-line">
                <span>Subtotal:</span>
                <span id="subtotal">$0.00</span>
            </div>
            <div class="summary-line">
                <span>Tax (10%):</span>
                <span id="tax">$0.00</span>
            </div>
            <div class="summary-line total">
                <span>Total:</span>
                <span id="total">$0.00</span>
            </div>
        </div>
    </div>

    <!-- 3. External JavaScript -->
    <script src="index.js"></script>
</body>
</html>
