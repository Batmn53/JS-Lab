<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Student Grading System</h1>
        <p class="subtitle">Enter student details and marks</p>

        <div class="form-section">
            <div class="input-group">
                <label>Student Name</label>
                <input type="text" id="student-name" placeholder="E.g. John Doe">
            </div>
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" id="roll-no" placeholder="E.g. 101">
            </div>
            
            <h3>Subject Marks (out of 100)</h3>
            <div class="input-group row">
                <div>
                    <label>Mathematics</label>
                    <input type="number" id="marks-math" min="0" max="100" placeholder="0-100">
                </div>
                <div>
                    <label>Science</label>
                    <input type="number" id="marks-science" min="0" max="100" placeholder="0-100">
                </div>
                <div>
                    <label>English</label>
                    <input type="number" id="marks-english" min="0" max="100" placeholder="0-100">
                </div>
            </div>

            <div id="error-message" class="error-msg" style="display: none;"></div>

            <button onclick="calculateGrade()">Calculate Grade</button>
        </div>

        <div id="result-section" class="result-section" style="display: none;">
            <h2>Result Card</h2>
            <div class="result-row"><span>Name:</span> <span id="out-name"></span></div>
            <div class="result-row"><span>Roll No:</span> <span id="out-roll"></span></div>
            <hr>
            <div class="result-row"><span>Total Marks:</span> <span id="out-total"></span></div>
            <div class="result-row"><span>Percentage:</span> <span id="out-percentage"></span></div>
            <div class="result-row grade-row"><span>Grade:</span> <strong id="out-grade"></strong></div>
            <div class="message-box" id="out-message"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
